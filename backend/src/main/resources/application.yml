spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fitpulse}
    username: ${SPRING_DATASOURCE_USERNAME:fitpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:fitpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # mail nije neophodan za rad aplikacije, pa ne sme da obori health
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:FitPulse <no-reply@fitpulse.local>}
    # adresa frontenda, za link u mailu za promenu lozinke
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  admin:
    email: ${ADMIN_MAIL:}
    password: ${ADMIN_PASSWORD:}
