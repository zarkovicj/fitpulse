server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # upload slike vežbe je do 2 MB (nginx podrazumevano dozvoljava samo 1 MB)
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # isti origin za frontend i API, pa CORS nije potreban
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular fajlovi imaju heš u imenu, pa smeju da se keširaju zauvek
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: svaka nepoznata putanja (npr. /workouts/5) vraća index.html, a rutu rešava Angular
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
