<app-auth-layout>
  <h1 class="font-display text-4xl font-bold">Prijava</h1>
  <p class="mt-2 text-slate">Nastavi tamo gde si stao.</p>

  @if (notice) {
    <p class="mt-6 rounded-md border border-plate-green/30 bg-plate-green/10 px-3 py-2.5 text-sm font-medium text-plate-green" role="status">
      {{ notice }}
    </p>
  }

  <!-- name i autocomplete su tu da bi browser prepoznao formu: nudi sačuvane mailove i pita da sačuva lozinku -->
  <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <p class="rounded-md border border-plate-red/30 bg-plate-red/5 px-3 py-2.5 text-sm text-plate-red" role="alert">
        {{ message }}
      </p>
    }

    <div>
      <label class="field-label" for="email">Mail</label>
      <input
        id="email"
        name="username"
        class="field-input"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="invalid('email')"
        aria-describedby="email-error"
      />
      @if (invalid('email')) {
        <p id="email-error" class="field-error">Unesi ispravan mail.</p>
      }
    </div>

    <div>
      <div class="mb-1.5 flex items-baseline justify-between gap-3">
        <label class="field-label mb-0" for="password">Lozinka</label>
        <a routerLink="/forgot-password" class="text-sm font-medium text-plate-blue hover:underline">Zaboravljena lozinka?</a>
      </div>
      <input
        id="password"
        name="password"
        class="field-input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="invalid('password')"
        aria-describedby="password-error"
      />
      @if (invalid('password')) {
        <p id="password-error" class="field-error">Unesi lozinku.</p>
      }
    </div>

    <label class="flex items-center gap-2.5 text-sm">
      <input type="checkbox" class="size-4 accent-plate-blue" formControlName="remember" />
      Zapamti mail na ovom uređaju
    </label>

    <button class="btn-primary w-full" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Prijavljivanje…' : 'Prijavi se' }}
    </button>
  </form>

  <p class="mt-8 text-slate">
    Nemaš nalog?
    <a class="font-semibold text-plate-blue hover:underline" routerLink="/register">Napravi ga</a>
  </p>
</app-auth-layout>
